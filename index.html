<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open City</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }
      .shadow { text-shadow: 0 2px 4px rgba(0,0,0,.6); }
      #title { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 28px; letter-spacing: .3em; font-weight: 600; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .45 } }
      #cash { position: absolute; top: 18px; right: 22px; font-size: 34px; font-weight: 800; color: #9be564; }
      #stars { position: absolute; top: 60px; right: 22px; font-size: 26px; letter-spacing: 2px; }
      #stars .on { color: #ffd166; } #stars .off { color: rgba(255,255,255,.18); }
      #stars.flash .on { animation: flash .5s steps(2) infinite; }
      @keyframes flash { 50% { color: #ef476f } }
      #clock { position: absolute; top: 96px; right: 22px; font-size: 16px; opacity: .85; }
      #prompt { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 18px; background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 6px; display: none; }
      #job { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); font-size: 18px; background: rgba(10,20,40,.6); padding: 8px 16px; border-radius: 8px; display: none; text-align: center; max-width: 60vw; }
      #toast { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; opacity: 0; transition: opacity .3s; text-align: center; }
      #speedo { position: absolute; right: 22px; bottom: 22px; text-align: right; display: none; }
      #speedo .v { font-size: 44px; font-weight: 800; line-height: 1; } #speedo .u { font-size: 14px; opacity: .8; }
      #health { width: 160px; height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; margin-top: 8px; overflow: hidden; }
      #health div { height: 100%; background: #06d6a0; }
      #minimap { position: absolute; left: 22px; bottom: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
      #help { position: absolute; left: 22px; top: 18px; font-size: 13px; opacity: .75; line-height: 1.5; }
      #debug { position: absolute; left: 22px; top: 120px; font: 12px/1.5 ui-monospace, monospace; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 6px; display: none; white-space: pre; }
      #chat { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); width: min(560px, 90vw); background: rgba(12,18,32,.92); border-radius: 10px; padding: 12px; display: none; pointer-events: auto; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
      #chat .head { font-weight: 700; margin-bottom: 6px; } #chat .head span { font-weight: 400; opacity: .7; font-size: 13px; }
      #chat .log { max-height: 220px; overflow-y: auto; font-size: 15px; line-height: 1.45; margin-bottom: 8px; }
      #chat .log .me { color: #9ecbff; } #chat .log .npc { color: #fff; } #chat .log .act { color: #ffd166; font-style: italic; font-size: 13px; }
      #chat input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #456; background: #0b1222; color: #fff; font-size: 15px; outline: none; }
      #chat .hint { font-size: 12px; opacity: .55; margin-top: 4px; }
      #vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(170,0,0,.55) 100%); transition: opacity .2s; --flash: 0; }
      #hp { position: absolute; top: 122px; right: 22px; display: none; align-items: center; gap: 8px; font-size: 18px; color: #ef476f; }
      #hp .bar { width: 120px; height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
      #hp .bar div { height: 100%; width: 100%; }
      #death { position: absolute; inset: 0; background: #000; display: none; opacity: 0; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
      #death .t { font: 900 64px system-ui, sans-serif; letter-spacing: .25em; color: #e9ecef; }
      #death .s { font-size: 18px; color: #adb5bd; }
      #pause { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6,10,20,.55); pointer-events: auto; }
      #pause .panel { width: min(440px, calc(100vw - 32px)); background: #121a2b; border: 1px solid #2c3a57; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #pause h2 { margin: 0; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; }
      #pause button { font: 600 15px system-ui, sans-serif; color: #fff; background: #23395d; border: 1px solid #3d5a85; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
      #pause button:hover, #pause button:focus-visible { background: #2f4f80; outline: 2px solid #7bdff2; outline-offset: 1px; }
      #pause button.primary { background: #2a7a4b; border-color: #3fa66a; font-size: 17px; }
      #pause .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin-bottom: 6px; }
      #pause .seg { display: flex; gap: 6px; } #pause .seg button { flex: 1; }
      #pause .seg button.on { background: #f4c430; color: #111; border-color: #f4c430; }
      #pause .desc { font-size: 13px; opacity: .75; margin-top: 6px; }
      #pause .attrib { font-size: 11px; opacity: .55; line-height: 1.35; }
      #pause .controls { font-size: 13px; line-height: 1.6; opacity: .8; }
      #hotbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: rgba(8,12,22,.55); border-radius: 10px; }
      #hotbar .slot { position: relative; width: 52px; height: 52px; border-radius: 8px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; }
      #hotbar .slot.sel { border-color: #f4c430; background: rgba(244,196,48,.18); }
      #hotbar .slot img { width: 44px; height: 44px; image-rendering: auto; }
      #hotbar .slot .n { position: absolute; top: 2px; left: 5px; font-size: 11px; opacity: .7; }
      #hotbar .slot .q { position: absolute; bottom: 2px; right: 5px; font-size: 11px; font-weight: 700; }
      #hotbar-name { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .25s; }
      .bubble { position: absolute; left: 0; top: 0; padding: 5px 9px; background: rgba(255,255,255,.94); color: #14181f; border-radius: 10px; font: 600 13px system-ui, sans-serif; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.35); will-change: transform; }
      .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: rgba(255,255,255,.94); border-bottom: 0; }
      .bubble.alert { background: #ffd23f; }
      .bubble .pb { height: 4px; margin-top: 4px; background: rgba(0,0,0,.15); border-radius: 2px; overflow: hidden; } .bubble .pb div { height: 100%; width: 0; background: #d62828; }
      #chat .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      #chat .quick button { font: 600 14px system-ui, sans-serif; color: #fff; background: #23395d; border: 1px solid #3d5a85; border-radius: 18px; padding: 8px 12px; min-height: 36px; cursor: pointer; touch-action: manipulation; }
      #chat .quick button:hover, #chat .quick button:focus-visible { background: #2f4f80; outline: 2px solid #7bdff2; outline-offset: 1px; }
      #chat .quick button:active { transform: scale(.96); }
      #chat .close { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 16px; cursor: pointer; }
      #chat .head { padding-right: 40px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="title" class="shadow" role="status" aria-live="polite">loading city…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
